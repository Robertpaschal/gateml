version: "3.9"

# ─── GateML — Local Development Stack ────────────────────────────────────────
# Usage:
#   docker compose up        # start all services
#   docker compose up -d     # start in background
#   docker compose logs -f   # stream logs
#   docker compose down -v   # stop and remove volumes

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       gateml
      POSTGRES_USER:     gateml
      POSTGRES_PASSWORD: gateml
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateml"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NestJS Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
      target:     builder          # Use builder stage for dev (hot reload)
    command: npm run dev
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://gateml:gateml@db:5432/gateml
      NODE_ENV:     development
    volumes:
      - ./backend/src:/app/src:ro  # Mount source for hot reload
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      target:     builder
    command: npm run dev
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ./frontend/app:/app/app:ro
      - ./frontend/components:/app/components:ro
      - ./frontend/src:/app/src:ro
    ports:
      - "3000:3000"   # Next.js on 3000 inside Docker; keep 5173 for local non-Docker
    depends_on:
      - backend

volumes:
  pgdata:
