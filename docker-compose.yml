# ─── GateML — Local Development Stack ────────────────────────────────────────
# Usage:
#   docker compose up --build   # rebuild images and start
#   docker compose up -d        # start in background
#   docker compose logs -f      # stream logs
#   docker compose down -v      # stop and remove volumes

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       gateml
      POSTGRES_USER:     gateml
      POSTGRES_PASSWORD: gateml
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateml"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── NestJS Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
      target:     builder          # Use builder stage for dev (has devDeps for nest CLI)
    command: sh -c "npx prisma migrate deploy && npm run dev"
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL:        postgresql://gateml:gateml@db:5432/gateml   # Overrides .env — uses Docker service name
      NODE_ENV:            development
      FRONTEND_URL:        http://localhost:3000    # Browser-side origin for CORS
      ADMIN_FRONTEND_URL:  http://localhost:3002    # Admin panel origin for CORS
    volumes:
      - ./backend/src:/app/src:ro  # Mount source for hot reload
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend (consumer) ─────────────────────────────────────────────
  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
      target:     builder
    command: npm run dev
    restart: unless-stopped
    env_file: ./frontend/.env.local
    environment:
      # Browser-side API calls: browser is on the host, so localhost:3001 works
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server-side rewrites (next.config.ts): must use Docker service name
      INTERNAL_API_URL:    http://backend:3001
    volumes:
      - ./frontend/app:/app/app:ro
      - ./frontend/components:/app/components:ro
      - ./frontend/lib:/app/lib:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/src:/app/src:ro
    ports:
      - "3000:5173"   # Next.js dev runs on 5173 inside the container; expose as 3000 on host
    depends_on:
      - backend

  # ── Admin Panel ──────────────────────────────────────────────────────────────
  admin:
    build:
      context:    ./admin
      dockerfile: Dockerfile
      target:     builder          # builder stage has devDeps for next dev
    command: npm run dev
    restart: unless-stopped
    environment:
      # Browser calls the backend from the host machine
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Server-side rewrites (next.config.ts BACKEND_URL): Docker service name
      BACKEND_URL: http://backend:3001
      NODE_ENV:    development
    volumes:
      - ./admin/app:/app/app:ro
      - ./admin/components:/app/components:ro
      - ./admin/lib:/app/lib:ro
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  pgdata:
